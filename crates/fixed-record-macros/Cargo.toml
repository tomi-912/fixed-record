[package]
name = "fixed-record-macros"
version = "0.1.0"
edition = "2024"
license = "MIT-0"
description = "Procedural macro implementation for the fixed-record crate"
repository = "https://github.com/tomi-912/fixed-record"
documentation = "https://docs.rs/fixed-record-macros"
readme = "../../README.md"
keywords = ["fixed-width", "record", "proc-macro", "codegen"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
default = ["list"]
list = []

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.4"
