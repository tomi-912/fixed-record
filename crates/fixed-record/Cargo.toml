[package]
name = "fixed-record"
version = "0.1.0"
edition = "2024"
license = "MIT-0"

[features]
default = ["list"]
list = ["fixed-record-macros/list"]

[dependencies]
# Use the local proc macro crate while developing the workspace.
# workspace 開発中はローカルパスの proc macro crate を使います。
fixed-record-macros = { path = "../fixed-record-macros", default-features = false }
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
trybuild = "1.0"
